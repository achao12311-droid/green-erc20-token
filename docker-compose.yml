services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: eco
      POSTGRES_PASSWORD: eco
      POSTGRES_DB: eco
    ports:
      - "5432:5432"
    volumes:
      - eco-pg:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  backend:
    build: ./backend
    environment:
      PORT: 4000
      APP_ORIGIN: http://localhost:3000
      APP_DOMAIN: localhost
      DATABASE_URL: postgresql://eco:eco@postgres:5432/eco
      SESSION_SECRET: dev-only-change-me
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis
  ai:
    build: ./ai
    ports:
      - "8000:8000"
  website:
    build: ./website
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"

volumes:
  eco-pg:
